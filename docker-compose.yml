version: '3.8'

services:
  mongodb:
    image: mongo:8
    container_name: mongodb_guias
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: spring_backend
    expose:
      - "8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/guiasdocentes
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - JWT_SECRET=${JWT_SECRET:-cambia_esta_clave_en_produccion}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "9003:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
