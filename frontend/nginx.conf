server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck simple del contenedor frontend
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # IMPORTANTE: esta ruta debe aparecer ANTES de location /
    # El navegador llama a /api/... sobre el dominio público del frontend.
    # Nginx, dentro de Docker, reenvía la petición al servicio backend:8080.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # React/Vite SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
